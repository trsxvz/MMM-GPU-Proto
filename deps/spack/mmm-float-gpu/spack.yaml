# Environment of the prototype in float on the GPU (plan
# docs/plan-precision.md, validation, step 4): MFEM 4.10 with CUDA and
# precision=single, with hypre (CUDA, Umpire) in single precision and MUMPS
# +float. The packages refused by MFEM in single precision (SuiteSparse,
# AmgX, GSLIB, SUNDIALS, SuperLU, STRUMPACK, Ginkgo, libCEED) are not used,
# nor cuDSS, Kokkos and PETSc. Same instance of spack (1.2.2), same packages
# (develop branch of spack-packages, commit 3b7fdffc24) and same externals
# (NVIDIA HPC SDK 25.11, CUDA 13.0.2) as the environment mmm-gpu, which is
# not modified; the packages common to both (OpenMPI, Umpire...) are shared.
spack:
  specs:
  - nvhpc@25.11
  - cuda@13.0.2
  - openmpi@5 +cuda +internal-hwloc +internal-pmix
  - hypre@3.2.0 +mpi +cuda +umpire ~int64 precision=single cuda_arch=120
  - mumps +mpi +float
  # C++20, as mfem-mgis
  - mfem@4.10.0 +mpi +shared ~static +cuda cuda_arch=120 precision=single
    cxxstd=20 +umpire +mumps
  - cmake
  view: true
  config:
    # cache of this instance of spack: the cache of the user (~/.spack/cache)
    # is shared with the other instances of spack of the machine, whose
    # repository `builtin` may be at another commit (index of the patches)
    misc_cache: $spack/var/spack/misc-cache
  concretizer:
    unify: true
    reuse: false
  repos:
    mmm_gpu: $env/../repos/spack_repo/mmm_gpu
    builtin: /home/t/Bureau/spack-packages-mmm/repos/spack_repo/builtin
  packages:
    all:
      require: [target=x86_64_v3]
    mpi:
      require: [openmpi@5]
    # shared library of gslib: libmfem.so links it, and its static library
    # is not relocatable
    gslib:
      require: [+shared]
    # OpenBLAS rather than the BLAS and LAPACK of the HPC SDK
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    c:
      require: [gcc@14.2.0]
    cxx:
      require: [gcc@14.2.0]
    fortran:
      require: [gcc@14.2.0]
    gcc:
      buildable: false
      externals:
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-14
            cxx: /usr/bin/g++-14
            fortran: /usr/bin/gfortran-14
    nvhpc:
      buildable: false
      externals:
      # BLAS and LAPACK of OpenBLAS (see above)
      - spec: nvhpc@25.11 ~blas ~lapack ~mpi
        prefix: /opt/nvidia/hpc_sdk
    cuda:
      buildable: false
      externals:
      - spec: cuda@13.0.2
        prefix: /home/t/Bureau/spack-mmm-externals/cuda-13.0.2
