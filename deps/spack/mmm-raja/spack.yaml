# Environment of the raja backend of TFEL and MGIS: RAJA 2026.07.0 for CUDA
# (sm_120) and OpenMP, with the compilers, the CUDA and the configuration of
# the environment mmm-gpu. RAJA with OpenMP needs a camp built with OpenMP,
# while the camp of mmm-gpu (a dependency of Umpire) is built without it:
# adding RAJA to mmm-gpu, whose packages are unified, would build Umpire and
# the packages that depend on it again. The other packages keep the hashes of
# mmm-gpu, and are reused.
spack:
  specs:
  - cuda@13.0.2
  # RAJA 2025.12.2 and older do not support CUDA 13
  # shared library, as Kokkos: the libraries of behaviours are shared
  - raja@2026.07.0 +cuda +openmp +shared ~examples ~exercises cuda_arch=120
  - cmake
  view: true
  config:
    # cache of this instance of spack (see mmm-gpu)
    misc_cache: $spack/var/spack/misc-cache
  concretizer:
    unify: true
    reuse: false
  repos:
    mmm_gpu: $env/../repos/spack_repo/mmm_gpu
    builtin: /home/t/Bureau/spack-packages-mmm/repos/spack_repo/builtin
  packages:
    all:
      require: [target=x86_64_v3]
    c:
      require: [gcc@14.2.0]
    cxx:
      require: [gcc@14.2.0]
    fortran:
      require: [gcc@14.2.0]
    gcc:
      buildable: false
      externals:
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-14
            cxx: /usr/bin/g++-14
            fortran: /usr/bin/gfortran-14
    cuda:
      buildable: false
      externals:
      - spec: cuda@13.0.2
        prefix: /home/t/Bureau/spack-mmm-externals/cuda-13.0.2
