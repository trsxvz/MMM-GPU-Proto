# Environment of the prototype (spack 1.2.2, packages of the develop branch
# of spack-packages, commit 3b7fdffc24).
#
# NVIDIA HPC SDK 25.11 and its CUDA 13.0.2 are external: the CUDA used by the
# packages is the one of the SDK (drivers >= 580, e.g. A100 nodes), seen
# through a prefix with the layout of the standalone toolkit, built by
#   deps/spack/make-nvhpc-cuda-prefix.sh \
#     /opt/nvidia/hpc_sdk/Linux_x86_64/25.11 13.0 \
#     ~/Bureau/spack-mmm-externals/cuda-13.0.2
# (the mathematical libraries of the SDK are in a separate directory). The GPU
# architecture is given by `cuda_arch`: 120 (Blackwell, RTX 5080) here, 80
# for A100 (Kokkos supports one architecture per build).
#
# Solvers and preconditioners: MFEM 4.10 with CUDA and with all the libraries of interest for the study of the solvers
# on CPU and GPU (see docs/solveurs-gpu.md): hypre, Ginkgo, PETSc (with
# Kokkos, for GAMG), SUNDIALS (KINSOL), AmgX, SuperLU_DIST, STRUMPACK, and
# the direct solvers of mfem-mgis on CPU (MUMPS, UMFPACK), and cuDSS.
# The packages of the repository mmm_gpu (deps/spack/repos) replace the
# ones of spack for AdaptiveCpp, AmgX (commit compatible with CUDA 13),
# OpenMPI (internal hwloc without OpenCL) and PETSc (Kokkos 5).
spack:
  specs:
  - nvhpc@25.11
  - cuda@13.0.2
  # GPU-aware MPI, with its internal hwloc (built without OpenCL, see the
  # package openmpi of mmm_gpu): the hwloc of spack with CUDA would rebuild
  # LLVM and TBB, used by TFEL
  - openmpi@5 +cuda +internal-hwloc +internal-pmix
  # Kokkos 5 always enables the CUDA lambdas
  - kokkos@5.2.2 +cuda +openmp +serial +shared +wrapper ~cuda_relocatable_device_code
    +cuda_constexpr cxxstd=20 cuda_arch=120
  # as built by PETSc itself: libraries of CUDA, instantiations for the
  # execution spaces
  - kokkos-kernels@5.2.2 +cuda +openmp +shared +cublas +cusparse +cusolver
    +execspace_cuda +execspace_openmp +execspace_serial +memspace_cudaspace
    cuda_arch=120
  # distributed matrices and solvers of Ginkgo (MPI)
  - ginkgo@1.11.0 +cuda +openmp +mpi cuda_arch=120
  - hypre@3.2.0 +mpi +cuda +umpire ~int64 cuda_arch=120
  # GAMG on the GPU (aijkokkos, aijcusparse), with hypre; OpenMP as Kokkos
  # (the headers of a Kokkos built with OpenMP require it)
  - petsc@3.26.0 +mpi +cuda +kokkos +openmp +hypre +metis ~fortran ~hdf5
    cuda_arch=120
  # KINSOL (fixed point with Anderson acceleration, Newton-Krylov)
  - sundials +mpi +cuda cuda_arch=120
  - superlu-dist +cuda cuda_arch=120
  # without the compressions of STRUMPACK on the CPU (ButterflyPACK, ZFP)
  - strumpack +mpi +cuda ~butterflypack ~zfp cuda_arch=120
  - amgx@2.5.0.20260701 +cuda +mpi cuda_arch=120
  - cudss@0.7.1-13 +mpi
  # MFEM 4.10: interface to cuDSS, distributed solvers of Ginkgo. C++20:
  # Umpire 2026 (camp) requires it, and mfem-mgis uses it. OpenMP backend
  # (same kernels on a multicore CPU, requires threadsafe) and libCEED
  # backend (CPU and GPU)
  - mfem@4.10.0 +mpi +shared ~static +cuda cuda_arch=120 cxxstd=20 +openmp
    +threadsafe +libceed +ginkgo +petsc +sundials +superlu-dist +strumpack
    +amgx +cudss +umpire +suite-sparse +mumps +gslib
  - hip@7.2.3 +cuda ~rocm
  # one LLVM: AdaptiveCpp 25.10 supports LLVM 15 to 20
  - llvm@20.1.8 +clang +lld ~lldb ~flang ~mlir ~python ~lua +offload +libomptarget
    openmp=runtime targets=x86,nvptx
  - adaptivecpp@25.10.0 +cuda
  - intel-tbb@2023.1.0
  - cmake
  view: true
  config:
    # cache of this instance of spack: the cache of the user (~/.spack/cache)
    # is shared with the other instances of spack of the machine, whose
    # repository `builtin` may be at another commit (index of the patches)
    misc_cache: $spack/var/spack/misc-cache
  concretizer:
    unify: true
    reuse: false
  repos:
    mmm_gpu: $env/../repos/spack_repo/mmm_gpu
    builtin: /home/t/Bureau/spack-packages-mmm/repos/spack_repo/builtin
  packages:
    all:
      require: [target=x86_64_v3]
    mpi:
      require: [openmpi@5]
    # shared library of gslib: libmfem.so links it, and its static library
    # is not relocatable
    gslib:
      require: [+shared]
    # OpenBLAS rather than the BLAS and LAPACK of the HPC SDK
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    c:
      require: [gcc@14.2.0]
    cxx:
      require: [gcc@14.2.0]
    fortran:
      require: [gcc@14.2.0]
    gcc:
      buildable: false
      externals:
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-14
            cxx: /usr/bin/g++-14
            fortran: /usr/bin/gfortran-14
    nvhpc:
      buildable: false
      externals:
      # BLAS and LAPACK of OpenBLAS (see above)
      - spec: nvhpc@25.11 ~blas ~lapack ~mpi
        prefix: /opt/nvidia/hpc_sdk
    cuda:
      buildable: false
      externals:
      - spec: cuda@13.0.2
        prefix: /home/t/Bureau/spack-mmm-externals/cuda-13.0.2
