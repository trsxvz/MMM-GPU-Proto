# Configuration of spack for Jean Zay (A100 partition), included by the
# environment deps/spack/mmm-light: the compilers, CUDA, MPI and CMake of
# the modules of IDRIS (deps/machines/jean-zay-a100/machine.sh) as external
# packages, the architecture of the GPUs and the target of the processors.
#
# x86_64_v3 (AVX2): the processors of the A100 nodes (AMD EPYC) have no
# AVX-512. The compilers of the modules of the A100 partition also run on
# the login nodes and on the CPU partition (Cascade Lake): the libraries can
# be built there.
packages:
  all:
    require: [target=x86_64_v3]
    # A100 (sm_80)
    prefer: [cuda_arch=80]
  c:
    require: [gcc@14.2.0]
  cxx:
    require: [gcc@14.2.0]
  fortran:
    require: [gcc@14.2.0]
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /gpfslocalsup/spack_soft/gcc/14.2.0/gcc-11.3.1-qtl6wfanpqnsrxmg4lrwtzbdtwtjhtaw
      extra_attributes:
        compilers:
          c: /gpfslocalsup/spack_soft/gcc/14.2.0/gcc-11.3.1-qtl6wfanpqnsrxmg4lrwtzbdtwtjhtaw/bin/gcc
          cxx: /gpfslocalsup/spack_soft/gcc/14.2.0/gcc-11.3.1-qtl6wfanpqnsrxmg4lrwtzbdtwtjhtaw/bin/g++
          fortran: /gpfslocalsup/spack_soft/gcc/14.2.0/gcc-11.3.1-qtl6wfanpqnsrxmg4lrwtzbdtwtjhtaw/bin/gfortran
  cuda:
    buildable: false
    externals:
    - spec: cuda@13.0.3
      prefix: /lustre/fshomisc/sys/common/nvidia/cuda/13.0
  # Open MPI of IDRIS: PSM2 (Omni-Path) and PMIx of Slurm, compiled with CUDA
  mpi:
    require: [openmpi]
  openmpi:
    buildable: false
    externals:
    - spec: openmpi@4.1.8 +cuda fabrics=psm2 schedulers=slurm
      prefix: /gpfslocalsup/spack_soft/openmpi/4.1.8/gcc-14.2.0-b5bfmz6cxo5evxfv6ypwptptofvgcrec
  cmake:
    buildable: false
    externals:
    - spec: cmake@3.31.4
      prefix: /gpfslocalsup/spack_soft/cmake/3.31.4/gcc-11.3.1-v7bvjx6psfzh2ydyqlpd6t6d6wzcy2s2
config:
  # builds in the temporary directory: $JOBSCRATCH in the jobs (TMPDIR)
  build_stage:
  - $tempdir/$user/spack-stage
