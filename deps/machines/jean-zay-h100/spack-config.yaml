# Configuration of spack for Jean Zay (H100 partition), included by the
# environment deps/spack/mmm-light: the compilers, CUDA, MPI and CMake of
# the modules of IDRIS (deps/machines/jean-zay-h100/machine.sh) as external
# packages, the architecture of the GPUs and the target of the processors.
#
# x86_64_v4 (AVX-512): the libraries also run on the processors of the
# login nodes (Cascade Lake). They are built on the H100 partition
# (Sapphire Rapids) only, where the gcc of its modules runs (on Cascade
# Lake, it stops with "Illegal instruction", see docs/install.md).
packages:
  all:
    require: [target=x86_64_v4]
    # H100 (sm_90)
    prefer: [cuda_arch=90]
  c:
    require: [gcc@14.2.0]
  cxx:
    require: [gcc@14.2.0]
  fortran:
    require: [gcc@14.2.0]
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o
      extra_attributes:
        compilers:
          c: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/gcc
          cxx: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/g++
          fortran: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/gfortran
  cuda:
    buildable: false
    externals:
    - spec: cuda@13.0.3
      prefix: /lustre/fshomisc/sys/common/nvidia/cuda/13.0
  # Open MPI of IDRIS: UCX (InfiniBand) and PMI of Slurm, compiled with CUDA
  mpi:
    require: [openmpi]
  openmpi:
    buildable: false
    externals:
    - spec: openmpi@4.1.8 +cuda fabrics=ucx schedulers=slurm
      prefix: /lustre/fshomisc/sup/spack_soft/openmpi/4.1.8/gcc-14.2.0-ckjwahmg5tbam5s2ehc7bsselb325z4f
  cmake:
    buildable: false
    externals:
    - spec: cmake@3.31.4
      prefix: /lustre/fshomisc/sup/spack_soft/cmake/3.31.4/gcc-11.3.1-wccdaabjwxgieho2uh6c4wjqcxjpcoik
config:
  # builds in the temporary directory: $JOBSCRATCH in the jobs (TMPDIR)
  build_stage:
  - $tempdir/$user/spack-stage
